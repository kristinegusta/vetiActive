<!-- Breadcrumb Schema Markup for 3HPhysio -->
{% if page.url != '/' and page.url != '/en/' and page.url != '/404.html' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "{% if '/en/' in page.url %}Home{% else %}Home{% endif %}",
      "item": "https://{{ client.domain }}{% if '/en/' in page.url %}/en/{% else %}/{% endif %}"
    }
    {%- if page.url != '/en/' and page.url != '/' -%}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ title | replace(' | 3HPhysio', '') | replace(' | 3HPhysio Nederland', '') | replace(' Netherlands', '') | replace(' Nederland', '') | truncate(50, true, '...') }}",
      "item": "https://{{ client.domain }}{{ page.url }}"
    }
    {%- endif -%}
  ]
}
</script>
{% endif %}
